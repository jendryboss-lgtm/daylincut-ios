name: DaylinCut
options:
  bundleIdPrefix: com.daylincut
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DaylinCut:
    type: application
    platform: iOS
    sources:
      - path: DaylinCut
        excludes:
          - "**/*.storekit"
      - path: DaylinCut/Resources/DaylinCut.storekit
        buildPhase: none
    info:
      path: DaylinCut/Info.plist
      properties:
        CFBundleDisplayName: "Daylin Cut"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - metal
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - tiktok
          - snssdk1233
        NSPhotoLibraryUsageDescription: Daylin Cut needs access to your photos and videos so you can add them to your edits.
        NSPhotoLibraryAddUsageDescription: Daylin Cut saves your exported videos and edited photos to your library.
        NSCameraUsageDescription: Daylin Cut uses the camera to record new clips and photos for your projects.
        NSMicrophoneUsageDescription: Daylin Cut uses the microphone to record voice-overs and video sound.
        NSSpeechRecognitionUsageDescription: Daylin Cut transcribes speech in your videos to create automatic captions.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daylincut.app
        PRODUCT_NAME: DaylinCut
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: DaylinCut/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  DaylinCutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaylinCutTests
    dependencies:
      - target: DaylinCut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daylincut.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DaylinCut.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DaylinCut
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DaylinCut:
    build:
      targets:
        DaylinCut: all
        DaylinCutTests: [test]
    run:
      config: Debug
      storeKitConfiguration: DaylinCut/Resources/DaylinCut.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: DaylinCutTests
    archive:
      config: Release
